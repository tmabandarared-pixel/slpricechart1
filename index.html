<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin & 92 Octane Petrol Tracker | Sri Lanka</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --card-bg: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --btc-color: #2d5a27;
      --fuel-color: #ef4444;
      --border-color: #e2e8f0;
      --pill-bg: #ffffff;
      --pill-border: #d1d5db;
      --pill-active-bg: #1c3d18;
      --pill-active-text: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .header-title h1 { font-size: 1.6rem; margin: 0 0 6px 0; font-weight: 700; }
    .header-title p.subtitle { color: var(--text-muted); margin: 0; font-size: 0.9rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--pill-active-bg);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
    }

    .btn svg { width: 16px; height: 16px; fill: currentColor; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
    }

    .card .title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .card .value { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .card .subvalue { font-size: 0.85rem; color: var(--text-muted); }

    .chart-container {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px 20px 16px 20px;
      margin-bottom: 24px;
      position: relative;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .chart-title { font-size: 1.05rem; font-weight: 600; }
    canvas { width: 100% !important; max-height: 340px; }

    /* Pill Navigation Controls */
    .time-pills {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .pill {
      background-color: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill:hover { background-color: #f1f5f9; }

    .pill.active {
      background-color: var(--pill-active-bg);
      border-color: var(--pill-active-bg);
      color: var(--pill-active-text);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>BTC & 92 Octane Petrol Tracker (Sri Lanka)</h1>
      <p class="subtitle">Live market feeds and historical price performance in LKR</p>
    </div>
    <button class="btn" onclick="exportDataToCSV()">
      <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
      Export CSV
    </button>
  </header>

  <section class="metrics-grid">
    <div class="card" style="border-top: 4px solid var(--btc-color);">
      <div class="title">Bitcoin (Live LKR)</div>
      <div class="value" id="btc-lkr">Loading...</div>
      <div class="subvalue" id="btc-usd">Fetching rate...</div>
    </div>
    <div class="card" style="border-top: 4px solid var(--fuel-color);">
      <div class="title">92 Octane Petrol (Liter)</div>
      <div class="value" id="fuel-lkr">Rs. 414.00</div>
      <div class="subvalue">CPC / LIOC Tariff</div>
    </div>
    <div class="card" style="border-top: 4px solid #2563eb;">
      <div class="title">Purchasing Ratio</div>
      <div class="value" id="ratio-val">Loading...</div>
      <div class="subvalue">Liters 92 Octane per 1 BTC</div>
    </div>
  </section>

  <section class="chart-container">
    <div class="chart-header">
      <div class="chart-title">Bitcoin Historical Trend (LKR)</div>
    </div>
    <canvas id="btcChart"></canvas>
    
    <!-- Timeframe Filter Pills -->
    <div class="time-pills">
      <button class="pill" onclick="changeTimeframe('48H', this)">48H</button>
      <button class="pill" onclick="changeTimeframe('1W', this)">1W</button>
      <button class="pill active" onclick="changeTimeframe('1M', this)">1M</button>
      <button class="pill" onclick="changeTimeframe('6M', this)">6M</button>
      <button class="pill" onclick="changeTimeframe('12M', this)">12M</button>
      <button class="pill" onclick="changeTimeframe('5Y', this)">5Y</button>
    </div>
  </section>

  <script>
    const CURRENT_PETROL_LKR = 414.00;
    let btcChartInstance = null;
    let activeFrame = '1M';
    let liveBtcLkr = 25876346;

    // Timeframe Data Maps
    const datasets = {
      '48H': {
        labels: ['00:00', '08:00', '16:00', '24:00', '32:00', '40:00', '48:00'],
        btc: [25.7, 25.8, 25.6, 25.8, 25.9, 25.8, 25.88],
        petrol: [414, 414, 414, 414, 414, 414, 414]
      },
      '1W': {
        labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7'],
        btc: [24.6, 24.8, 25.1, 25.3, 25.5, 25.7, 25.88],
        petrol: [414, 414, 414, 414, 414, 414, 414]
      },
      '1M': {
        labels: ['W1', 'W2', 'W3', 'W4'],
        btc: [21.4, 20.9, 21.1, 25.88],
        petrol: [414, 414, 414, 414]
      },
      '6M': {
        labels: ['Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'],
        btc: [20.5, 22.2, 25.4, 19.3, 20.4, 25.88],
        petrol: [434, 434, 434, 414, 414, 414]
      },
      '12M': {
        labels: ['Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'],
        btc: [18.2, 21.5, 24.8, 26.1, 25.4, 23.8, 20.5, 22.2, 25.4, 19.3, 20.4, 25.88],
        petrol: [434, 434, 434, 434, 434, 434, 434, 434, 434, 414, 414, 414]
      },
      '5Y': {
        labels: ['2022', '2023', '2024', '2025', '2026'],
        btc: [7.2, 11.4, 19.8, 28.5, 25.88],
        petrol: [338, 365, 346, 398, 414]
      }
    };

    // Live BTC Fetch
    async function fetchLiveBtc() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,lkr');
        const data = await res.json();
        
        const btcUsd = data.bitcoin.usd;
        liveBtcLkr = data.bitcoin.lkr;

        document.getElementById('btc-lkr').innerText = `Rs. ${Math.round(liveBtcLkr).toLocaleString('en-LK')}`;
        document.getElementById('btc-usd').innerText = `$${btcUsd.toLocaleString()} USD`;

        const liters = Math.round(liveBtcLkr / CURRENT_PETROL_LKR);
        document.getElementById('ratio-val').innerText = `${liters.toLocaleString()} L`;
      } catch (err) {
        document.getElementById('btc-lkr').innerText = `Rs. ${Math.round(liveBtcLkr).toLocaleString('en-LK')}`;
        document.getElementById('btc-usd').innerText = `$87,500 USD`;
        const liters = Math.round(liveBtcLkr / CURRENT_PETROL_LKR);
        document.getElementById('ratio-val').innerText = `${liters.toLocaleString()} L`;
      }
    }

    // Chart Renderer
    function renderChart(frameKey) {
      const dataConfig = datasets[frameKey];
      const ctx = document.getElementById('btcChart').getContext('2d');

      if (btcChartInstance) btcChartInstance.destroy();

      btcChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dataConfig.labels,
          datasets: [{
            label: 'BTC Price (Million LKR)',
            data: dataConfig.btc,
            borderColor: '#2d5a27',
            borderWidth: 2,
            pointRadius: 0,
            pointHoverRadius: 6,
            tension: 0.15,
            fill: false
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#64748b' } },
            y: { 
              grid: { color: '#f1f5f9' }, 
              ticks: { 
                color: '#64748b',
                callback: (val) => `${val.toFixed(1)}M` 
              } 
            }
          }
        }
      });
    }

    // Switch active timeframe pill
    function changeTimeframe(frameKey, el) {
      activeFrame = frameKey;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderChart(frameKey);
    }

    // CSV Exporter
    function exportDataToCSV() {
      const dataConfig = datasets[activeFrame];
      const headers = ['Interval', 'BTC Price (Million LKR)', 'Petrol 92 Price (LKR)', 'Ratio (Liters per BTC)'];
      const rows = [];

      dataConfig.labels.forEach((lbl, i) => {
        const btcM = dataConfig.btc[i];
        const petrol = dataConfig.petrol[i];
        const ratio = Math.round((btcM * 1000000) / petrol);
        rows.push([`"${lbl}"`, btcM, petrol, ratio]);
      });

      let csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\n";
      rows.forEach(r => csvContent += r.join(",") + "\n");

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `btc_vs_petrol_${activeFrame.toLowerCase()}_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Initialize Page
    window.addEventListener('DOMContentLoaded', async () => {
      await fetchLiveBtc();
      renderChart(activeFrame);
    });
  </script>
</body>
</html>
